name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Prevent overlapping releases racing to bump/push the version
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Skip the run this workflow's own version-bump commit produces
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version bump commit/tag + create the GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build library
        run: npm run build

      - name: Determine version bump
        id: bump
        run: |
          LEVEL=patch
          while IFS= read -r -d '' msg; do
            subject="$(printf '%s' "$msg" | head -n1)"
            if printf '%s' "$msg" | grep -qE 'BREAKING CHANGE' || printf '%s' "$subject" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:'; then
              LEVEL=major
            elif [ "$LEVEL" != "major" ] && printf '%s' "$subject" | grep -qE '^feat(\([^)]*\))?:'; then
              LEVEL=minor
            fi
          done < <(jq -j '.commits[] | .message + "\u0000"' "$GITHUB_EVENT_PATH")
          echo "Resolved bump level: $LEVEL"
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump library version and tag
        id: version
        run: |
          NEW_VERSION=$(npm version "${{ steps.bump.outputs.level }}" --prefix projects/grid --no-git-tag-version)
          git add projects/grid/package.json
          git commit -m "chore(release): $NEW_VERSION [skip ci]"
          git tag "$NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Push version bump
        run: git push origin HEAD:${{ github.ref_name }} --follow-tags

      - name: Rebuild library with bumped version
        run: npm run build

      - name: Publish to npm
        run: npm publish
        working-directory: dist/grid
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Package dist
        run: (cd dist/grid && zip -r ../../dist.zip .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist.zip
