<div
  class="gd-root"
  role="grid"
  [attr.aria-rowcount]="rowData().length + 1"
  [attr.aria-colcount]="columns().length"
>
  <div class="gd-row gd-row--header" role="row">
    @for (col of columns(); track col.key) {
      <div class="gd-cell gd-cell--header" role="columnheader" [ngClass]="col.def.cellClass" [style]="col.style">
        {{ col.def.headerName ?? col.def.field }}
      </div>
    }
  </div>

  @if (rowData().length === 0) {
    <div class="gd-empty" role="row">
      <div class="gd-cell" role="gridcell">No rows to display</div>
    </div>
  } @else {
    <cdk-virtual-scroll-viewport [itemSize]="rowHeight()" [style.height]="height()" class="gd-viewport">
      <div
        class="gd-row"
        role="row"
        [style.height.px]="rowHeight()"
        [attr.aria-rowindex]="rowIndex + 2"
        *cdkVirtualFor="let row of rowData(); trackBy: trackRow; let rowIndex = index"
      >
        @for (col of columns(); track col.key) {
          <div class="gd-cell" role="gridcell" [ngClass]="col.def.cellClass" [style]="col.style">
            {{ cellDisplay(row, col.def) }}
          </div>
        }
      </div>
    </cdk-virtual-scroll-viewport>
  }
</div>
